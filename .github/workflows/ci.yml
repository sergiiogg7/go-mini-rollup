# Written for GitHub Actions. After every push check `gh run list --repo sergiiogg7/go-mini-rollup`.
name: ci
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go test ./internal/proto -run xxx -fuzz=FuzzDecodeBatch -fuzztime=20s
  integration:
    # internal/l1 against a real Anvil (the unit job above skips these tests: no anvil there)
    name: "integration (real Anvil)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: REQUIRE_ANVIL=1 go test ./internal/l1 -count=1 -v
  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std --no-git
      - run: forge fmt --check
      - run: forge test
      - name: Slither (DepositPortal)
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts
          slither-config: contracts/slither.config.json
          slither-args: --exclude-dependencies
          fail-on: low
  demo:
    runs-on: ubuntu-latest
    needs: [go, integration, contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: (cd contracts && forge install foundry-rs/forge-std --no-git)
      - run: bash scripts/demo.sh
