# Written for GitHub Actions; not run locally (no runner here). Check `gh run list` after the first push.
name: ci
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go test ./internal/proto -run xxx -fuzz=FuzzDecodeBatch -fuzztime=20s
  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std --no-git
      - run: forge fmt --check
      - run: forge test
  demo:
    runs-on: ubuntu-latest
    needs: [go, contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: (cd contracts && forge install foundry-rs/forge-std --no-git)
      - run: bash scripts/demo.sh
